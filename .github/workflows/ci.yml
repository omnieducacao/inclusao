name: CI — Testes Automatizados

on:
  push:
    branches: [main, nextjs-migration]
    paths:
      - 'nextjs-app/**'
  pull_request:
    branches: [main, nextjs-migration]
    paths:
      - 'nextjs-app/**'

defaults:
  run:
    working-directory: nextjs-app

jobs:
  test:
    name: Vitest Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: nextjs-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Checar tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Checar o código (ESLint, só erros)
        run: npx eslint --quiet .

      - name: Run tests
        run: npm test

      # SCRUM-253: o mesmo build do Render, para o push sair reprovado aqui e não no deploy.
      - name: Build de produção (igual ao Render)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: test-service

      - name: Run tests with coverage
        if: github.event_name == 'pull_request'
        run: npx vitest run --coverage --reporter=verbose
