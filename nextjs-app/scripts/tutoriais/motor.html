<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tutoriais Omnisfera · motor</title>
<!--
  Motor dos vídeos curtos dos tutoriais (lib/tutoriais.ts). Desenha a tela da Omnisfera quadro a quadro:
  render(t) monta o estado da cena no segundo t, sem relógio, para o gravar.py tirar 30 quadros por segundo.
  Uso: motor.html?v=<cena>  (estudantes, pei, paee, hub, diario, avaliacao, evolucao). Estudante fictício.
-->
<style>
@font-face { font-family: "Jakarta"; src: url("PlusJakartaSans.ttf") format("truetype"); font-weight: 200 800; }
:root {
  --fundo:#f6f4f0; --superficie:#fff; --superficie-2:#efebe4; --borda:#e3ded6;
  --tinta:#1b2a4a; --tinta-2:#3d4a63; --tinta-3:#5d6a80;
  --acao:#1d5f9f; --acao-suave:#e6f0fb; --sucesso:#1b7446; --sucesso-suave:#e3f4eb;
  --atencao:#8a6200; --atencao-suave:#fdf4dc; --roxo:#6a3dba; --roxo-suave:#f1eafb;
  --vermelho:#e5484d; --amarelo:#f5b82e; --laranja:#f28c28; --roxo-c:#8e5bd8; --azul:#2f7fd1; --verde:#2eaa6a;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 960px; height: 600px; overflow: hidden; background: var(--fundo); font-family: "Jakarta", system-ui, sans-serif; color: var(--tinta); }
#tela { position: relative; width: 960px; height: 600px; display: grid; grid-template-columns: 176px 1fr; grid-template-rows: 46px 1fr; }
#topo { grid-column: 1 / 3; display: flex; align-items: center; gap: 10px; padding: 0 18px; background: var(--superficie); border-bottom: 1px solid var(--borda); }
.marca { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; letter-spacing: -.02em; }
.pontos { position: relative; width: 22px; height: 22px; }
.pontos i { position: absolute; width: 7px; height: 7px; border-radius: 50%; }
.topo-dir { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--tinta-3); }
.avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--roxo-suave); color: var(--roxo); display: grid; place-items: center; font-weight: 800; font-size: 11px; }
#lado { background: var(--superficie); border-right: 1px solid var(--borda); padding: 12px 8px; display: grid; align-content: start; gap: 2px; }
.grupo { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-3); padding: 10px 8px 4px; font-family: ui-monospace, monospace; }
.item { font-size: 12.5px; padding: 7px 10px; border-radius: 8px; color: var(--tinta-2); font-weight: 600; }
.item.on { background: var(--acao-suave); color: var(--acao); }
#conteudo { position: relative; padding: 18px 22px; overflow: hidden; }
h1 { margin: 0 0 2px; font-size: 22px; letter-spacing: -.02em; }
.sub { margin: 0 0 14px; font-size: 12.5px; color: var(--tinta-3); }
.cartao { background: var(--superficie); border: 1px solid var(--borda); border-radius: 12px; padding: 12px 14px; }
.rot { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-3); font-family: ui-monospace, monospace; margin-bottom: 4px; }
.campo { display: grid; gap: 3px; font-size: 11.5px; font-weight: 700; color: var(--tinta-2); }
.entrada { min-height: 30px; border: 1px solid var(--borda); border-radius: 8px; background: #fff; padding: 6px 9px; font-weight: 500; font-size: 12.5px; color: var(--tinta); white-space: pre-wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px; border-radius: 9px; font-weight: 700; font-size: 12.5px; border: 1px solid var(--borda); background: #fff; color: var(--tinta); transition: none; }
.btn.pri { background: var(--acao); border-color: var(--acao); color: #fff; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--superficie-2); color: var(--tinta-2); }
.chip.ok { background: var(--sucesso-suave); color: var(--sucesso); }
.chip.at { background: var(--atencao-suave); color: var(--atencao); }
.chip.in { background: var(--acao-suave); color: var(--acao); }
.grade { display: grid; gap: 10px; }
.linha { display: flex; align-items: center; gap: 10px; }
.passos { display: flex; gap: 6px; margin-bottom: 12px; }
.passo { flex: 1; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--borda); background: #fff; font-size: 11.5px; font-weight: 700; color: var(--tinta-3); }
.passo b { display: block; font-size: 9.5px; font-weight: 600; color: var(--tinta-3); letter-spacing: .08em; text-transform: uppercase; font-family: ui-monospace, monospace; }
.passo.on { border-color: var(--acao); background: var(--acao-suave); color: var(--acao); }
.passo.feito { color: var(--sucesso); }
.caixa { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--tinta-3); display: inline-grid; place-items: center; flex: none; }
.caixa.on { background: var(--acao); border-color: var(--acao); }
.caixa.on::after { content: ""; width: 7px; height: 4px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
.prox { border: 1px solid var(--borda); background: var(--superficie-2); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
.prox .ir { background: #fff; border: 1px solid var(--borda); border-radius: 10px; padding: 9px 12px; display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 12.5px; }
.prox .ir small { display: block; font-weight: 500; color: var(--tinta-3); font-size: 11px; }
.seta { color: var(--acao); font-weight: 800; }
.nivel { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--borda); display: grid; place-items: center; font-weight: 800; font-size: 13px; background: #fff; }
.nivel.on { background: var(--acao); color: #fff; border-color: var(--acao); }
.barra { height: 10px; border-radius: 5px; background: var(--superficie-2); overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--acao); border-radius: 5px; }
#cursor { position: absolute; left: 0; top: 0; width: 22px; height: 22px; z-index: 50; pointer-events: none; }
#onda { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 3px solid var(--acao); z-index: 49; opacity: 0; pointer-events: none; }
#legenda { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 60; background: rgba(27,42,74,.94); color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 700; white-space: nowrap; display: flex; gap: 10px; align-items: center; box-shadow: 0 6px 20px rgba(27,42,74,.25); }
#legenda b { background: #fff; color: var(--tinta); border-radius: 50%; width: 22px; height: 22px; display: grid; place-items: center; font-size: 12px; }
.ia { font-size: 12px; line-height: 1.55; color: var(--tinta-2); white-space: pre-wrap; }
.pulso { box-shadow: 0 0 0 3px rgba(29,95,159,.25); }
</style>
</head>
<body>
<div id="tela">
  <header id="topo">
    <span class="marca"><span class="pontos">
      <i style="left:7px;top:0;background:var(--amarelo)"></i><i style="left:15px;top:4px;background:var(--laranja)"></i>
      <i style="left:15px;top:12px;background:var(--roxo-c)"></i><i style="left:7px;top:15px;background:var(--azul)"></i>
      <i style="left:0;top:12px;background:var(--verde)"></i><i style="left:0;top:4px;background:var(--vermelho)"></i>
    </span>omnisfera</span>
    <span class="topo-dir">Escola Exemplo <span class="avatar">PA</span></span>
  </header>
  <nav id="lado"></nav>
  <main id="conteudo"></main>
  <div id="onda"></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2 L4 19 L8.5 15 L11.5 21.5 L14 20.4 L11 14 L17 14 Z" fill="#1b2a4a" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
  <div id="legenda"><b>1</b><span></span></div>
</div>
<script>
// ─── utilidades determinísticas ──────────────────────────────────────────────
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const prog = (t, t0, d) => cl((t - t0) / d);
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];

function aparece(el, t, t0, d = .45, dy = 10) {
  if (!el) return; const p = ease(prog(t, t0, d));
  el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * dy}px)`;
}
function some(el, t, t0, d = .3) { if (!el) return; if (t >= t0) { el.style.opacity = 1 - ease(prog(t, t0, d)); } }
function digita(el, texto, t, t0, cps = 30) {
  if (!el) return; const n = Math.floor(cl((t - t0) * cps, 0, texto.length));
  el.textContent = t < t0 ? "" : texto.slice(0, n) + (n < texto.length && t >= t0 ? "▍" : "");
}
function marca(el, cls, t, t0) { if (el) el.classList.toggle(cls, t >= t0); }
function aperta(el, t, tc) { if (!el) return; const p = prog(t, tc, .22); const s = p > 0 && p < 1 ? 1 - .06 * Math.sin(p * Math.PI) : 1; el.style.transform = `scale(${s})`; }
function conta(el, ate, t, t0, d = 1, casas = 0) { if (!el) return; el.textContent = (ate * ease(prog(t, t0, d))).toFixed(casas).replace(".", ","); }

// cursor: pontos {t, el|xy, clica}
let CAMINHO = [];
function centro(alvo) {
  if (Array.isArray(alvo)) return alvo;
  const el = typeof alvo === "string" ? $(alvo) : alvo; if (!el) return [480, 300];
  const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2];
}
function cursor(t) {
  const pts = CAMINHO.map((p) => ({ ...p, xy: centro(p.alvo) }));
  let x = pts[0]?.xy[0] ?? 480, y = pts[0]?.xy[1] ?? 520;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i]; const ini = b.t - (b.viagem ?? .7);
    if (t >= b.t) { [x, y] = b.xy; continue; }
    if (t > ini) { const p = ease(prog(t, ini, b.t - ini)); x = a.xy[0] + (b.xy[0] - a.xy[0]) * p; y = a.xy[1] + (b.xy[1] - a.xy[1]) * p; }
    break;
  }
  const c = $("#cursor"); c.style.transform = `translate(${x - 4}px, ${y - 2}px)`;
  const onda = $("#onda"); onda.style.opacity = 0;
  for (const p of pts) if (p.clica) { const q = prog(t, p.t, .45); if (q > 0 && q < 1) { onda.style.left = p.xy[0] + "px"; onda.style.top = p.xy[1] + "px"; onda.style.opacity = 1 - q; onda.style.transform = `scale(${.5 + q})`; } }
}
let LEGENDAS = [];
function legenda(t) {
  const L = $("#legenda"); const atual = LEGENDAS.filter((l) => t >= l.t).pop();
  if (!atual) { L.style.opacity = 0; return; }
  L.querySelector("b").textContent = atual.n; L.querySelector("span").textContent = atual.txt;
  const p = ease(prog(t, atual.t, .35)); L.style.opacity = p; L.style.transform = `translateX(-50%) translateY(${(1 - p) * 8}px)`;
}

// ─── menu lateral ────────────────────────────────────────────────────────────
const MENU = [["", "Início"], ["Acompanhar o estudante", "Estudantes", "PEI", "PAEE", "Diário de bordo"], ["Planejar e avaliar", "Hub de recursos", "Avaliação", "Evolução e dados"]];
function menu(ativo) {
  $("#lado").innerHTML = MENU.map((g) => (g[0] ? `<div class="grupo">${g[0]}</div>` : "") + g.slice(1).map((i) => `<div class="item${i === ativo ? " on" : ""}">${i}</div>`).join("")).join("");
}
const PROX = (titulo, itens) => `<div class="prox" id="prox"><div class="rot">${titulo}</div>${itens.map(([a, b], i) => `<div class="ir" id="ir${i}"><span>${a}<small>${b}</small></span><span class="seta">→</span></div>`).join("")}</div>`;
const CAB = (h, s) => `<h1>${h}</h1><p class="sub">${s}</p>`;
const EST = `<div class="linha" style="margin-bottom:10px"><span class="avatar" style="background:var(--acao-suave);color:var(--acao)">LF</span><b style="font-size:14px">Lucas Final</b><span class="sub" style="margin:0">4º ano · Turma A</span></div>`;

// ─── cenas ───────────────────────────────────────────────────────────────────
const CENAS = {
  estudantes: {
    menu: "Estudantes", dur: 10,
    html: CAB("Estudantes", "Em que pé está o PEI e o PAEE de cada estudante.") + `
      <div class="linha" style="justify-content:space-between;margin-bottom:10px"><div class="entrada" style="width:260px;color:var(--tinta-3)">Buscar por nome, série ou turma</div><span class="btn pri" id="novo">+ Cadastrar estudante</span></div>
      <div class="cartao" id="lista" style="padding:0">
        ${[["Ana Clara", "2º ano · B", "Vigente", "ok"], ["Davi Souza", "6º ano · A", "Rascunho", ""], ["Laura Melo", "7º ano · A", "Revisão chegando", "at"]].map(([n, s, e, c]) => `<div class="linha" style="padding:10px 14px;border-bottom:1px solid var(--borda)"><b style="flex:1;font-size:13px">${n}</b><span class="sub" style="margin:0;width:120px">${s}</span><span class="chip ${c}">${e}</span></div>`).join("")}
        <div class="linha" id="novaLinha" style="padding:10px 14px;background:var(--acao-suave)"><b style="flex:1;font-size:13px">Lucas Final</b><span class="sub" style="margin:0;width:120px">4º ano · A</span><span class="chip">Sem PEI</span></div>
      </div>
      <div class="cartao" id="form" style="position:absolute;left:150px;top:90px;width:420px;box-shadow:0 18px 50px rgba(27,42,74,.2);display:grid;gap:10px">
        <b>Cadastrar estudante</b>
        <label class="campo">Nome<div class="entrada" id="nome"></div></label>
        <div class="linha"><label class="campo" style="flex:1">Série<div class="entrada" id="serie"></div></label><label class="campo" style="flex:1">Turma<div class="entrada" id="turma"></div></label></div>
        <div class="linha" style="justify-content:flex-end"><span class="btn pri" id="salvar">Cadastrar</span></div>
      </div>
      <div class="cartao" id="ficha" style="position:absolute;left:22px;right:22px;top:60px;bottom:18px;display:grid;gap:10px;align-content:start">
        ${EST}
        <div class="grade" style="grid-template-columns:repeat(3,1fr)">${[["PEI", "Sem estudo de caso", "pei"], ["PAEE", "Nenhum ciclo", ""], ["Diário de bordo", "0 registros", ""], ["Avaliação", "Ainda não avaliado", ""], ["Hub de recursos", "0 materiais", ""], ["Evolução e dados", "—", ""]].map(([a, b, id]) => `<div class="cartao" ${id ? `id="c-${id}"` : ""} style="background:var(--fundo)"><b style="font-size:13px">${a}</b><div class="sub" style="margin:2px 0 0">${b}</div></div>`).join("")}</div>
      </div>`,
    setup() {
      CAMINHO = [{ t: 0, alvo: [700, 520] }, { t: 1.2, alvo: "#novo", clica: true }, { t: 2.2, alvo: "#nome", clica: true }, { t: 4.4, alvo: "#salvar", clica: true }, { t: 6.4, alvo: "#novaLinha", clica: true }, { t: 8.6, alvo: "#c-pei", clica: true }];
      LEGENDAS = [{ t: .3, n: 1, txt: "Cadastre o estudante" }, { t: 6, n: 2, txt: "Abra a ficha dele" }, { t: 8.2, n: 3, txt: "Da ficha, siga para o PEI" }];
    },
    anim(t) {
      aperta($("#novo"), t, 1.2);
      const f = $("#form"); f.style.opacity = t < 1.3 ? 0 : t < 4.6 ? ease(prog(t, 1.3, .3)) : 1 - ease(prog(t, 4.6, .3));
      digita($("#nome"), "Lucas Final", t, 2.4, 9); digita($("#serie"), "4º ano", t, 3.4, 12); digita($("#turma"), "A", t, 3.9, 8);
      aperta($("#salvar"), t, 4.4);
      const nl = $("#novaLinha"); nl.style.display = t >= 4.8 ? "flex" : "none"; aparece(nl, t, 4.8);
      const fi = $("#ficha"); fi.style.opacity = t < 6.6 ? 0 : ease(prog(t, 6.6, .4));
      marca($("#c-pei"), "pulso", t, 8.6);
    },
  },

  pei: {
    menu: "PEI", dur: 11,
    html: CAB("PEI", "Plano Educacional Individualizado: do estudo de caso à revisão, em quatro etapas.") + EST + `
      <div class="passos">${[["Etapa 1", "Estudo de caso"], ["Etapa 2", "PEI"], ["Etapa 3", "Vigente e ciência"], ["Etapa 4", "Revisão"]].map(([a, b], i) => `<div class="passo" id="p${i + 1}"><b>${a}</b>${b}</div>`).join("")}</div>
      <div class="cartao" id="e1" style="display:grid;gap:8px"><div class="rot">Estudo de caso</div><label class="campo">O que você observa<div class="entrada" id="obs" style="min-height:62px"></div></label></div>
      <div class="cartao" id="e2" style="display:grid;gap:8px;position:absolute;left:22px;right:22px;top:202px"><div class="linha" style="justify-content:space-between"><div class="rot" style="margin:0">Texto do PEI</div><span class="btn" id="gerar">✦ Gerar com IA</span></div><div class="ia" id="ia"></div></div>
      <div class="cartao" id="e3" style="display:grid;gap:10px;position:absolute;left:22px;right:22px;top:202px"><div class="rot">Tornar vigente</div><div class="linha"><label class="campo" style="flex:1">Próxima revisão<div class="entrada">15/03/2027</div></label><span class="btn pri" id="vigente" style="align-self:end">Tornar vigente</span></div><div class="linha"><span class="chip" id="status">Rascunho</span><span class="sub" style="margin:0" id="enviado"></span></div></div>
      <div id="proxwrap" style="position:absolute;left:22px;right:22px;bottom:62px">${PROX("Com o PEI vigente, o próximo passo", [["Planejar o AEE (PAEE)", "Transforme as metas do PEI em ciclos de atendimento."], ["Avaliar", "Diagnóstica no começo e processual a cada período."]])}</div>`,
    setup() {
      CAMINHO = [{ t: 0, alvo: [700, 520] }, { t: .9, alvo: "#obs", clica: true }, { t: 3.6, alvo: "#p2", clica: true }, { t: 4.5, alvo: "#gerar", clica: true }, { t: 7.1, alvo: "#p3", clica: true }, { t: 7.9, alvo: "#vigente", clica: true }, { t: 9.8, alvo: "#ir0", clica: true }];
      LEGENDAS = [{ t: .3, n: 1, txt: "Estudo de caso: escreva o que observa" }, { t: 3.4, n: 2, txt: "A IA propõe metas; você revisa" }, { t: 7, n: 3, txt: "Torne vigente e envie aos professores" }, { t: 9.2, n: 4, txt: "Siga para o PAEE" }];
    },
    anim(t) {
      ["#p1", "#p2", "#p3", "#p4"].forEach((s, i) => { const on = [0, 3.6, 7.1, 99][i]; const fim = [3.6, 7.1, 99, 99][i]; const el = $(s); el.classList.toggle("on", t >= on && t < fim); el.classList.toggle("feito", t >= fim); });
      digita($("#obs"), "Lê palavras simples com apoio de imagem; perde o foco em textos longos. Engaja muito quando o tema é dinossauros.", t, 1.1, 42);
      $("#e1").style.opacity = t < 3.6 ? 1 : 0;
      const e2 = $("#e2"); e2.style.top = "202px"; e2.style.opacity = t >= 3.6 && t < 7.1 ? 1 : 0; aperta($("#gerar"), t, 4.5);
      digita($("#ia"), "Meta 1 · Ler e compreender textos curtos com apoio visual (EF35LP03).\nMeta 2 · Manter a atenção em tarefas de 15 minutos com pausas planejadas.\nEstratégia · Textos curtos, imagens e o interesse por dinossauros como contexto.", t, 4.8, 60);
      const e3 = $("#e3"); e3.style.opacity = t >= 7.1 ? 1 : 0; aperta($("#vigente"), t, 7.9);
      const st = $("#status"); st.textContent = t >= 8.1 ? "Vigente · versão 1" : "Rascunho"; st.className = "chip" + (t >= 8.1 ? " ok" : "");
      $("#enviado").textContent = t >= 8.4 ? "Enviado aos professores regentes da turma" : "";
      const pw = $("#proxwrap"); pw.style.opacity = t < 8.8 ? 0 : 1; aparece(pw, t, 8.8);
      marca($("#ir0"), "pulso", t, 9.8);
    },
  },

  paee: {
    menu: "PAEE", dur: 11,
    html: CAB("PAEE", "Plano de Atendimento Educacional Especializado: o AEE em ciclos.") + EST + `
      <div class="passos">${[["1", "Avaliar"], ["2", "Planejar"], ["3", "Atender"], ["4", "Articular"]].map(([a, b], i) => `<div class="passo" id="f${i + 1}"><b>Fase ${a}</b>${b}</div>`).join("")}</div>
      <div class="grade" id="corpo" style="grid-template-columns:1.1fr 1fr">
        <div class="cartao" style="display:grid;gap:8px"><div class="rot">Ciclo do AEE · metas do PEI</div>
          ${["Ler e compreender textos curtos com apoio visual", "Manter a atenção em tarefas de 15 minutos"].map((m, i) => `<div class="linha" style="font-size:12.5px"><span class="caixa" id="m${i}"></span>${m}</div>`).join("")}
          <div class="linha"><label class="campo" style="flex:1">Duração<div class="entrada" id="dur"></div></label><label class="campo" style="flex:1">Frequência<div class="entrada" id="freq"></div></label></div>
          <span class="btn pri" id="gerarc" style="justify-self:start">Gerar ciclo</span></div>
